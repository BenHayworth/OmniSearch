<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Files | OmniSearch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="OmniSearch home">
          <span class="brand-mark">O</span>
          <span>OmniSearch</span>
        </a>
        <nav class="topbar-actions" aria-label="Main navigation">
          <a class="nav-button" href="index.html">Search</a>
          <a class="nav-button active" href="files.html" aria-current="page">Files</a>
          <a class="nav-button" href="add-to-knowledge.html">Add to Knowledge</a>
        </nav>
      </header>

      <section class="hero" aria-labelledby="files-title">
        <p class="eyebrow">YOUR LIBRARY</p>
        <h1 id="files-title">Saved files</h1>
        <p class="subtitle">Files you have added to your knowledge.</p>
        <form class="search" action="files.html" method="get">
          <input id="files-query" name="q" type="search" aria-label="Search saved files" placeholder="Search saved files" />
          <input id="files-category" name="category" type="hidden" value="All" />
          <button class="filter active" type="submit">Search</button>
        </form>
        <p id="result-summary" class="result-summary" role="status"></p>
        <ul id="file-list" class="file-list" aria-label="Matching saved entries"></ul>
        <section id="no-matches" class="results" aria-labelledby="empty-title" hidden>
          <div class="empty-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z" />
              <path d="M14 3v5h5M9 13h6M9 17h6" />
            </svg>
          </div>
          <h2 id="empty-title">No matching entries</h2>
          <p>Try a different search or <a href="add-to-knowledge.html">add files to your knowledge</a>.</p>
        </section>
      </section>

      <footer>OmniSearch</footer>
    </main>
    <script src="files.js"></script>
  </body>
</html>
