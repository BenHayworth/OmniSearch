<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Add to Knowledge | OmniSearch</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="OmniSearch home">
        <span class="brand-mark">O</span>
        <span>OmniSearch</span>
      </a>
      <nav class="topbar-actions" aria-label="Main navigation">
        <a class="nav-button" href="index.html">Search</a>
        <a class="nav-button" href="files.html">Files</a>
        <a class="nav-button active" href="add-to-knowledge.html" aria-current="page">Add to Knowledge</a>
      </nav>
    </header>
    <section class="hero knowledge-page" aria-labelledby="knowledge-title">
      <p class="eyebrow">YOUR KNOWLEDGE</p>
      <h1 id="knowledge-title">Add to Knowledge</h1>
      <p class="subtitle">Choose a folder to review its files.</p>
      <section class="knowledge-card" aria-labelledby="folder-heading">
        <div class="knowledge-card-header">
          <h2 id="folder-heading">Selected folder</h2>
          <button class="folder-button" id="select-folder" type="button">Select folder</button>
        </div>
        <p class="folder-path" id="selected-folder">No folder selected.</p>
      </section>
      <p id="selection-status" class="selection-status" role="status"></p>
      <section class="knowledge-card" id="selected-files" aria-labelledby="files-heading" hidden>
        <div class="knowledge-card-header">
          <h2 id="files-heading">Selected files</h2>
          <span class="file-count" id="file-count">0 files</span>
        </div>
        <p class="file-preview-summary" id="file-preview-summary"></p>
        <ul class="knowledge-file-list" id="file-list" aria-label="Selected file preview"></ul>
      </section>
    </section>
    <footer>OmniSearch</footer>
  </main>
  <script src="add-to-knowledge.js"></script>
</body>

</html>
